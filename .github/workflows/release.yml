name: Release

# Push a tag like v0.1.0 to build self-contained single-file binaries and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS binaries are built on macOS, so the SDK signs them (ad hoc). Apple Silicon won't run an unsigned binary.
          - rid: osx-arm64
            os: macos-latest
          - rid: osx-x64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Laraue.Boards.Agent/Laraue.Boards.Agent.csproj \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$version" \
            -o out/laraue-boards-agent

      - name: Package
        run: |
          cp README.md LICENSE boards-agent.example.json out/laraue-boards-agent/
          name="laraue-boards-agent-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          mkdir dist
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            (cd out && zip -r "../dist/$name.zip" laraue-boards-agent)
          else
            tar -czf "dist/$name.tar.gz" -C out laraue-boards-agent
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
