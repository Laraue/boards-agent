name: .NET

# Builds the runner and runs its tests on pull requests and main; the Release workflow runs it first too.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x.x

    - name: Restore dependencies
      run: dotnet restore boards-agent.slnx

    - name: Build
      run: dotnet build boards-agent.slnx --no-restore -c Release

    - name: Run all tests
      run: dotnet test boards-agent.slnx -c Release --no-build
